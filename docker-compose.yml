services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ei
      POSTGRES_PASSWORD: ei
      POSTGRES_DB: ei_core
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ei -d ei_core"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8
    ports: ["6379:6379"]
